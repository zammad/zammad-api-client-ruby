name: CI
on:
  push:
    # 1-stable is the maintenance line for 1.x, kept apart from 2.0.
    branches: [1-stable]
  pull_request:
  # No schedule here: GitHub runs a scheduled workflow from the default branch
  # only, so a cron entry on this branch would never fire. Start a run by hand
  # instead, to see whether 1.x still passes against the current Zammad.
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: zammad/zammad-ci:latest
    steps:
      - uses: actions/checkout@v7
      - name: Run lint actions
        shell: bash
        run: |
          source /etc/profile.d/rvm.sh # ensure RVM is loaded
          bundle update --bundler
          bundle install -j $(nproc)
          bundle exec rubocop
  test:
    runs-on: ubuntu-latest
    container:
      image: zammad/zammad-ci:latest
    services:
      postgresql:
        image: postgres:17
        env:
          POSTGRES_USER: zammad
          POSTGRES_PASSWORD: zammad
      redis:
        image: redis:7
    steps:
      - uses: actions/checkout@v7
      - name: Set up Zammad
        shell: bash
        run: |
          git clone --depth 1 https://github.com/zammad/zammad.git
          cd zammad
          source /etc/profile.d/rvm.sh # ensure RVM is loaded
          bundle config set --local frozen 'true'
          bundle config set --local path 'vendor'
          bundle install -j $(nproc)
          bundle exec ruby .gitlab/configure_environment.rb
          source .gitlab/environment.env
          RAILS_ENV=test bundle exec rake db:create
          cp contrib/auto_wizard_test.json auto_wizard.json
          bundle exec rake zammad:ci:test:start
      - name: Run Ruby API integration tests
        shell: bash
        run: |
          source /etc/profile.d/rvm.sh # ensure RVM is loaded
          bundle update --bundler
          bundle install -j $(nproc)
          bundle exec rspec
