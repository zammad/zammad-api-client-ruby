name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, to catch breakage from new Ruby or Zammad releases.
    - cron: '0 6 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rubocop --format github

  types:
    name: Steep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec steep check

  unit:
    name: Unit specs (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the lowest entry in sync with required_ruby_version.
        ruby: ['3.4', '3.5', 'head']
    continue-on-error: ${{ matrix.ruby == 'head' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run unit specs
        run: bundle exec rake spec:unit
        env:
          COVERAGE: 'true'

  integration:
    name: Integration specs
    runs-on: ubuntu-latest
    container:
      image: zammad/zammad-ci:latest
    services:
      postgresql:
        image: postgres:17
        env:
          POSTGRES_USER: zammad
          POSTGRES_PASSWORD: zammad
      redis:
        image: redis:7
    steps:
      - uses: actions/checkout@v7
      - name: Set up Zammad
        shell: bash
        run: |
          git clone --depth 1 https://github.com/zammad/zammad.git
          cd zammad
          source /etc/profile.d/rvm.sh # ensure RVM is loaded
          bundle config set --local frozen 'true'
          bundle config set --local path 'vendor'
          bundle install -j $(nproc)
          bundle exec ruby .gitlab/configure_environment.rb
          source .gitlab/environment.env
          RAILS_ENV=test bundle exec rake db:create
          cp contrib/auto_wizard_test.json auto_wizard.json
          bundle exec rake zammad:ci:test:start
      - name: Run integration specs
        shell: bash
        run: |
          source /etc/profile.d/rvm.sh # ensure RVM is loaded
          bundle update --bundler
          bundle install -j $(nproc)
          bundle exec rake spec:integration
