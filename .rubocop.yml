plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  Exclude:
    - 'pkg/**/*'
    - 'vendor/**/*'
  # Keep in sync with required_ruby_version in the gemspec and the CI matrix.
  TargetRubyVersion: 3.4

# --- Zammad style guide -----------------------------------------------------

Style/NegatedIf:
  Description: 'Zammad prefers an explicit `if !x` over `unless x`.'
  Enabled: false

Style/IfUnlessModifier:
  Description: 'Zammad allows multi-line bodies for a single condition.'
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  Enabled: false

Style/TrailingCommaInArguments:
  Enabled: false

Layout/LeadingCommentSpace:
  Enabled: false

Layout/HashAlignment:
  Enabled: true
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table
  EnforcedLastArgumentHashStyle: always_inspect

Style/ClassAndModuleChildren:
  Enabled: false

Naming/MethodParameterName:
  AllowedNames: [id, to]

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Style/RescueStandardError:
  EnforcedStyle: implicit

Style/ArgumentsForwarding:
  # Named parameters keep public signatures self-documenting for YARD/RBS.
  UseAnonymousForwarding: false

Naming/BlockForwarding:
  EnforcedStyle: explicit

Naming/PredicateMethod:
  # Established names from the resource API; they return true on success.
  AllowedMethods:
    - save
    - destroy

Style/Documentation:
  Description: 'Public API documentation is enforced by review, not by this cop.'
  Enabled: false

Style/PerlBackrefs:
  Enabled: false

Style/BlockComments:
  Description: 'Block comments make examples easy to copy and paste.'
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/AbcSize:
  Max: 34

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  # Config mirrors every supported option as a keyword argument.
  Max: 14
  MaxOptionalParameters: 13

# Broken: "String".downcase == "strinG".downcase is not the same as
# "String".casecmp("strinG"), only as "String".casecmp("strinG") == 0.
Performance/Casecmp:
  Enabled: false

# --- Specs ------------------------------------------------------------------

RSpec/ExampleLength:
  CountAsOne: ['array', 'hash', 'heredoc']
  Max: 12
  # Integration specs are end-to-end scenarios against a live Zammad.
  Exclude:
    - 'spec/integration/**/*'

RSpec/MultipleExpectations:
  Description: 'A few request assertions per example are clearer than splitting them.'
  Max: 3
  Exclude:
    - 'spec/integration/**/*'

RSpec/DescribeMethod:
  Exclude:
    - 'spec/integration/**/*'

RSpec/NestedGroups:
  Max: 4

RSpec/SpecFilePathFormat:
  # Integration specs are grouped by the Zammad object they exercise, not by
  # the class under test.
  Exclude:
    - 'spec/integration/**/*'

RSpec/DescribeClass:
  Exclude:
    - 'spec/integration/**/*'

RSpec/BeforeAfterAll:
  Exclude:
    - 'spec/integration/**/*'

RSpec/LeakyLocalVariable:
  # The integration specs deliberately share a record across ordered examples.
  Exclude:
    - 'spec/integration/**/*'

RSpec/NoExpectationExample:
  Exclude:
    - 'spec/integration/**/*'
